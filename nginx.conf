server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index demo.html;

    add_header Permissions-Policy "display-capture=(self), microphone=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Without an explicit Cache-Control, browsers cache the HTML
    # heuristically (from Last-Modified) and keep showing a pre-deploy
    # page. no-cache forces revalidation on every load. add_header in a
    # location drops server-level headers, so those are repeated here.
    location = / {
        add_header Permissions-Policy "display-capture=(self), microphone=(self)" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files /examples/demo.html =404;
    }

    location ~ \.html$ {
        add_header Permissions-Policy "display-capture=(self), microphone=(self)" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        # Must outlast the audio server's MAX_FETCH_MS (10 min) plus its
        # title lookup: no bytes flow upstream until yt-dlp finishes, so a
        # shorter read timeout would 504 before the app's own error.
        proxy_read_timeout 720s;
        proxy_send_timeout 300s;
    }

    # dist changes every deploy and has no filename hashing: force
    # revalidation so Cloudflare never pins an old bundle for hours
    location /dist/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
