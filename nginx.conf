server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index demo.html;

    add_header Permissions-Policy "display-capture=(self), microphone=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        try_files /examples/demo.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
